<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0614"/><stop offset="0.55" stop-color="#2a0b2e"/><stop offset="1" stop-color="#0b1a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#fcd34d" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <!-- kolam motif -->
  <g transform="translate(1250 320)" fill="none" stroke-width="5" stroke-linecap="round">
    <circle r="210" stroke="#fcd34d" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="170" stroke="#fcd34d" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 12"/>
    <g stroke="#ffffff">
      <path d="M0 -130 C 70 -130 70 -60 0 -60 C -70 -60 -70 -130 0 -130 Z"/>
      <path d="M0 130 C 70 130 70 60 0 60 C -70 60 -70 130 0 130 Z"/>
      <path d="M-130 0 C -130 70 -60 70 -60 0 C -60 -70 -130 -70 -130 0 Z"/>
      <path d="M130 0 C 130 70 60 70 60 0 C 60 -70 130 -70 130 0 Z"/>
    </g>
    <g stroke="#f97316"><path d="M0 -60 L60 0 L0 60 L-60 0 Z"/></g>
    <g stroke="#ec4899" stroke-opacity="0.85"><path d="M-92 -92 Q0 -40 92 -92 Q40 0 92 92 Q0 40 -92 92 Q-40 0 -92 -92 Z"/></g>
    <g fill="#fcd34d" stroke="none">
      <circle r="9"/><circle cx="0" cy="-95" r="7"/><circle cx="0" cy="95" r="7"/><circle cx="-95" cy="0" r="7"/><circle cx="95" cy="0" r="7"/>
    </g>
  </g>
  <text x="90" y="120" font-size="22" font-weight="700" letter-spacing="6" fill="#f97316">PROLABS ROBOTICS · TEAM 1435 ROBOART SQUAD</text>
  <text x="84" y="262" font-size="132" font-weight="900" fill="url(#title)" letter-spacing="-3">Bharat Art-Bot</text>
  <text x="90" y="326" font-size="36" font-weight="700" fill="#ffffff">The robot that keeps rangoli and kolam alive</text>
  <text x="90" y="378" font-size="24" fill="#e9d5ff">WRO 2026 Future Innovators (Junior) · Bengaluru, India</text>
  <g transform="translate(90 430)" font-size="22" font-weight="800">
    <rect width="250" height="58" rx="29" fill="url(#accent)"/>
    <text x="125" y="37" text-anchor="middle" fill="#fff">4th in India</text>
    <rect x="270" width="330" height="58" rx="29" fill="#fcd34d"/>
    <text x="435" y="37" text-anchor="middle" fill="#1a0614">Technical Excellence</text>
    <rect x="620" width="280" height="58" rx="29" fill="none" stroke="#fcd34d" stroke-width="3"/>
